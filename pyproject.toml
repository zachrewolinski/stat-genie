[project]
name = "stat-genie"
version = "0.1.0"
description = ""
authors = [
    {name = "Zachary T. Rewolinski",email = "zachrewolinski@berkeley.edu"}
]
readme = "README.md"
dependencies = [
    "blade-bench (>=0.1.1,<0.2.0)",
    "transformers (==4.56.0)",
    "iprogress (>=0.4,<0.5)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "pydantic (==2.8.2)"
]

[tool.poetry]
packages = [{include = "stat_genie", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.7.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.9,<0.15.0)"
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]